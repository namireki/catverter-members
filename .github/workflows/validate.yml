name: Validate members catalogs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out members repository
        uses: actions/checkout@v4

      - name: Validate manifest and catalogs
        shell: pwsh
        run: ./tools/Test-CatverterMembers.ps1

      - name: Run regression tests
        shell: pwsh
        run: ./tests/Test-Validator.ps1
