name: Validate Committee roster

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Committee repository
        uses: actions/checkout@v4

      - name: Validate roster
        shell: pwsh
        run: ./tools/Test-Committee.ps1
